<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="AD Labs Edge Observer — compact edge-compute box with live on-device telemetry, premium studio render">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#18181d"/>
      <stop offset="55%" stop-color="#0d0d11"/>
      <stop offset="100%" stop-color="#07070a"/>
    </radialGradient>

    <radialGradient id="halo" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#8B7CF6" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#8B7CF6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="spot" cx="50%" cy="0%" r="95%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <!-- Aluminium body -->
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a5a66"/>
      <stop offset="18%" stop-color="#46464f"/>
      <stop offset="52%" stop-color="#313138"/>
      <stop offset="80%" stop-color="#24242b"/>
      <stop offset="100%" stop-color="#1b1b21"/>
    </linearGradient>

    <!-- Specular bevel -->
    <linearGradient id="bevel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="70%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Lid inset -->
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33333c"/>
      <stop offset="45%" stop-color="#28282f"/>
      <stop offset="100%" stop-color="#212127"/>
    </linearGradient>

    <!-- OLED panel -->
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#14141b"/>
    </linearGradient>

    <!-- Etched text -->
    <linearGradient id="etch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10"/>
    </linearGradient>

    <linearGradient id="reflection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b7cf6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="700" fill="url(#spot)" opacity="0.75"/>

  <!-- Ambient violet halo -->
  <ellipse cx="800" cy="500" rx="600" ry="470" fill="url(#halo)"/>

  <!-- Studio backdrop lines -->
  <g stroke="#ffffff" stroke-opacity="0.02">
    <line x1="0" y1="180" x2="1600" y2="180"/>
    <line x1="0" y1="340" x2="1600" y2="340"/>
    <line x1="0" y1="680" x2="1600" y2="680"/>
    <line x1="220" y1="840" x2="1380" y2="840" stroke-opacity="0.05"/>
  </g>

  <!-- =================  DEVICE  ================= -->
  <g>
    <!-- Contact shadow -->
    <ellipse cx="800" cy="828" rx="360" ry="30" fill="#000000" opacity="0.6"/>
    <ellipse cx="800" cy="820" rx="280" ry="20" fill="#000000" opacity="0.75"/>

    <!-- Body -->
    <rect x="480" y="200" width="640" height="620" rx="126" fill="url(#body)"/>

    <!-- Bevel / specular rim -->
    <rect x="480" y="200" width="640" height="620" rx="126" fill="url(#bevel)" opacity="0.55"/>
    <rect x="486" y="206" width="628" height="608" rx="120" fill="none" stroke="#000000" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Back edge: port cutouts -->
    <g fill="#0a0a0d">
      <rect x="1040" y="760" width="40" height="14" rx="4"/>
      <rect x="1096" y="760" width="40" height="14" rx="4"/>
      <rect x="1016" y="740" width="18" height="14" rx="3.5"/>
    </g>
    <g stroke="#000000" stroke-opacity="0.5">
      <path d="M1040 760 h40" fill="none"/>
    </g>

    <!-- Lid inset -->
    <rect x="528" y="248" width="544" height="536" rx="92" fill="url(#lid)"/>
    <rect x="528" y="248" width="544" height="536" rx="92" fill="none" stroke="#000000" stroke-opacity="0.3" stroke-width="1"/>

    <!-- Top glass reflection sweep -->
    <ellipse cx="800" cy="340" rx="400" ry="140" fill="#ffffff" opacity="0.05" transform="rotate(-7 800 340)"/>

    <!-- Wordmark -->
    <text x="800" y="352" text-anchor="middle" font-family="Inter, -apple-system, Segoe UI, sans-serif" font-size="46" font-weight="700" letter-spacing="1" fill="url(#etch)">AD Labs</text>

    <!-- Subtitle line -->
    <line x1="680" y1="378" x2="920" y2="378" stroke="#8B7CF6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="800" y="398" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" letter-spacing="6" fill="#ffffff" fill-opacity="0.16">EDGE OBSERVER</text>

    <!-- ========== ON-DEVICE LIVE PANEL (the intelligence) ========== -->
    <rect x="600" y="436" width="400" height="232" rx="26" fill="url(#screen)" stroke="#000000" stroke-opacity="0.6" stroke-width="1.5"/>
    <rect x="600" y="436" width="400" height="232" rx="26" fill="none" stroke="#8B7CF6" stroke-opacity="0.18" stroke-width="1"/>

    <!-- Panel header -->
    <text x="624" y="466" font-family="SF Mono, ui-monospace, monospace" font-size="11" letter-spacing="2.5" fill="#8B7CF6" fill-opacity="0.9">LIVE · LOCAL · ANONYMOUS</text>
    <circle cx="966" cy="461" r="4" fill="#8B7CF6" filter="url(#glow)"/>
    <circle cx="966" cy="461" r="1.8" fill="#ffffff" opacity="0.9"/>

    <!-- Sparkline on the panel -->
    <polyline points="624,584 660,572 696,578 732,556 768,560 804,536 840,542 876,518 912,524 940,502 968,506"
      fill="none" stroke="#8B7CF6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="624,584 660,572 696,578 732,556 768,560 804,536 840,542 876,518 912,524 940,502 968,506"
      fill="#8B7CF6" opacity="0.06" stroke="none"
      transform="translate(0 26) scale(1 0.45) translate(0 -26)"/>

    <!-- Three metrics -->
    <g>
      <text x="624" y="640" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.45">PASS</text>
      <text x="624" y="660" font-family="SF Mono, ui-monospace, monospace" font-size="21" font-weight="600" fill="#ffffff">2,481</text>
    </g>
    <g>
      <text x="756" y="640" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.45">STOP</text>
      <text x="756" y="660" font-family="SF Mono, ui-monospace, monospace" font-size="21" font-weight="600" fill="#ffffff">186</text>
    </g>
    <g>
      <text x="888" y="640" font-family="Inter, sans-serif" font-size="11" letter-spacing="1.5" fill="#ffffff" fill-opacity="0.45">STOP RATE</text>
      <text x="888" y="660" font-family="SF Mono, ui-monospace, monospace" font-size="21" font-weight="600" fill="#8B7CF6">7.5%</text>
    </g>

    <!-- Panel footer -->
    <line x1="616" y1="682" x2="984" y2="682" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="624" y="652" font-family="Inter, sans-serif" font-size="0" opacity="0"></text>

    <!-- Status LED on body -->
    <circle cx="800" cy="768" r="7" fill="#8B7CF6" filter="url(#glow)"/>
    <circle cx="800" cy="768" r="3.2" fill="#ffffff" opacity="0.85"/>

    <!-- Bottom etch -->
    <text x="800" y="796" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" letter-spacing="2.5" fill="#ffffff" fill-opacity="0.10">12W · POE · NO CLOUD VIDEO · ZERO FACES</text>
  </g>

  <!-- Floor reflection -->
  <g opacity="0.11" transform="translate(0 1640) scale(1 -1)">
    <rect x="480" y="200" width="640" height="620" rx="126" fill="url(#body)"/>
  </g>
  <rect x="480" y="828" width="640" height="140" fill="url(#reflection)" opacity="0.4"/>

  <!-- ==========  TECHNICAL CALLOUTS  ========== -->
  <!-- Left: input -->
  <g>
    <line x1="430" y1="470" x2="476" y2="480" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="430" cy="470" r="3" fill="#8B7CF6" opacity="0.7"/>
    <text x="418" y="452" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" letter-spacing="1" fill="#a1a1aa">RTSP / NVR</text>
    <text x="418" y="438" text-anchor="end" font-family="Inter, sans-serif" font-size="12.5" letter-spacing="1" fill="#a1a1aa" font-weight="600">CAMERA IN</text>
  </g>

  <!-- Right: output -->
  <g>
    <line x1="1170" y1="470" x2="1124" y2="480" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
    <circle cx="1170" cy="470" r="3" fill="#8B7CF6" opacity="0.7"/>
    <text x="1182" y="452" font-family="Inter, sans-serif" font-size="12.5" letter-spacing="1" fill="#a1a1aa">ANONYMOUS</text>
    <text x="1182" y="438" font-family="Inter, sans-serif" font-size="12.5" letter-spacing="1" fill="#a1a1aa" font-weight="600">SIGNALS OUT</text>
  </g>
</svg>