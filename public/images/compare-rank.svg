<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9792b"/>
      <stop offset="100%" stop-color="#a9792b" stop-opacity="0.1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Header -->
  <text x="400" y="50" textAnchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="28" fill="#a9792b" font-weight="700">Store Comparison</text>
  <text x="400" y="78" textAnchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6e6e73">Ranked by stop rate vs peer benchmark</text>
  <!-- Table rows -->
  <!-- Row 1 -->
  <rect x="60" y="110" width="680" height="56" rx="10" fill="#1c1c1e" stroke="#a9792b" stroke-opacity="0.15" stroke-width="1"/>
  <text x="90" y="144" font-family="Space Mono, monospace" font-size="16" fill="#a9792b" font-weight="700">#1</text>
  <text x="160" y="144" font-family="Inter, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">Maison Étoile</text>
  <text x="360" y="144" font-family="Inter, sans-serif" font-size="14" fill="#6e6e73">New York · Grade A</text>
  <text x="560" y="144" textAnchor="end" font-family="Space Mono, monospace" font-size="20" fill="#30d158" font-weight="700">11.4%</text>
  <text x="650" y="144" font-family="Inter, sans-serif" font-size="12" fill="#30d158">+2.5pp</text>
  <!-- Row 2 -->
  <rect x="60" y="178" width="680" height="56" rx="10" fill="#1c1c1e" stroke="#a9792b" stroke-opacity="0.1" stroke-width="1"/>
  <text x="90" y="212" font-family="Space Mono, monospace" font-size="16" fill="#6e6e73">#2</text>
  <text x="160" y="212" font-family="Inter, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">Beverly Hills Boutique</text>
  <text x="360" y="212" font-family="Inter, sans-serif" font-size="14" fill="#6e6e73">Los Angeles · Grade B</text>
  <text x="560" y="212" textAnchor="end" font-family="Space Mono, monospace" font-size="20" fill="#f5f5f7" font-weight="700">6.2%</text>
  <text x="650" y="212" font-family="Inter, sans-serif" font-size="12" fill="#c9372c">−2.7pp</text>
  <!-- Row 3 -->
  <rect x="60" y="246" width="680" height="56" rx="10" fill="#1c1c1e" stroke="#a9792b" stroke-opacity="0.1" stroke-width="1"/>
  <text x="90" y="280" font-family="Space Mono, monospace" font-size="16" fill="#6e6e73">#3</text>
  <text x="160" y="280" font-family="Inter, sans-serif" font-size="15" fill="#f5f5f7" font-weight="600">Mayfair Salon</text>
  <text x="360" y="280" font-family="Inter, sans-serif" font-size="14" fill="#6e6e73">London · Grade C</text>
  <text x="560" y="280" textAnchor="end" font-family="Space Mono, monospace" font-size="20" fill="#f5f5f7" font-weight="700">4.1%</text>
  <text x="650" y="280" font-family="Inter, sans-serif" font-size="12" fill="#c9372c">−4.8pp</text>
  <!-- Cohort bar -->
  <rect x="60" y="330" width="680" height="44" rx="10" fill="#1c1c1e" stroke="#6e6e73" stroke-opacity="0.2" stroke-width="1"/>
  <text x="90" y="358" font-family="Inter, sans-serif" font-size="14" fill="#6e6e73">Cohort median</text>
  <rect x="280" y="342" width="300" height="8" rx="4" fill="#121212"/>
  <rect x="280" y="342" width="180" height="8" rx="4" fill="#a9792b" opacity="0.5"/>
  <text x="600" y="358" font-family="Space Mono, monospace" font-size="16" fill="#6e6e73">8.9%</text>
  <!-- Bottom stats -->
  <rect x="60" y="400" width="200" height="60" rx="10" fill="#1c1c1e"/>
  <text x="160" y="428" textAnchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e6e73">Stores tracked</text>
  <text x="160" y="455" textAnchor="middle" font-family="Space Mono, monospace" font-size="24" fill="#f5f5f7" font-weight="700">3</text>
  <rect x="280" y="400" width="200" height="60" rx="10" fill="#1c1c1e"/>
  <text x="380" y="428" textAnchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e6e73">Peer benchmark</text>
  <text x="380" y="455" textAnchor="middle" font-family="Space Mono, monospace" font-size="24" fill="#a9792b" font-weight="700">8.9%</text>
  <rect x="500" y="400" width="240" height="60" rx="10" fill="#1c1c1e"/>
  <text x="620" y="428" textAnchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e6e73">Cohort size</text>
  <text x="620" y="455" textAnchor="middle" font-family="Space Mono, monospace" font-size="24" fill="#f5f5f7" font-weight="700">37</text>
</svg>
