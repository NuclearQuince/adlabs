  <rect x="80" y="316" width="640" height="44" rx="10" fill="#a9792b" opacity="0.12"/>
  <rect x="80" y="316" width="6" height="44" rx="3" fill="#a9792b"/>
  <text x="100" y="343" font-family="Inter, sans-serif" font-size="14" fill="#a9792b" font-weight="600">HIGH</text>
