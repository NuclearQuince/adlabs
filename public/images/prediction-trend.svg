<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9792b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a9792b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="confidence" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9792b" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#a9792b" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Header -->
  <text x="400" y="50" textAnchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="28" fill="#a9792b" font-weight="700">Prediction Trend</text>
  <text x="400" y="78" textAnchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6e6e73">8-week linear projection with confidence band</text>
  <!-- Chart area -->
  <rect x="60" y="100" width="680" height="300" rx="12" fill="#1c1c1e" stroke="#a9792b" stroke-opacity="0.15" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="60" y1="160" x2="740" y2="160" stroke="#a9792b" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="60" y1="220" x2="740" y2="220" stroke="#a9792b" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="60" y1="280" x2="740" y2="280" stroke="#a9792b" stroke-opacity="0.06" stroke-width="1"/>
  <line x1="60" y1="340" x2="740" y2="340" stroke="#a9792b" stroke-opacity="0.06" stroke-width="1"/>
  <!-- Confidence band -->
  <polygon points="140,180 220,170 300,155 380,145 460,130 540,120 620,115 700,110 700,130 620,135 540,140 460,150 380,165 300,175 220,190 140,200" fill="url(#confidence)"/>
  <!-- Area fill -->
  <path d="M140,180 L220,170 L300,155 L380,145 L460,130 L540,120 L620,115 L700,110 L700,400 L140,400 Z" fill="url(#area)"/>
  <!-- Line -->
  <polyline points="140,180 220,170 300,155 380,145 460,130 540,120 620,115 700,110" fill="none" stroke="#a9792b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dashed prediction -->
  <line x1="700" y1="110" x2="740" y2="95" stroke="#a9792b" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.6"/>
  <circle cx="700" cy="110" r="4" fill="#a9792b" opacity="0.5"/>
  <circle cx="740" cy="95" r="4" fill="#a9792b" opacity="0.3"/>
  <!-- Data points -->
  <circle cx="140" cy="180" r="3" fill="#a9792b"/>
  <circle cx="220" cy="170" r="3" fill="#a9792b"/>
  <circle cx="300" cy="155" r="3" fill="#a9792b"/>
  <circle cx="380" cy="145" r="3" fill="#a9792b"/>
  <circle cx="460" cy="130" r="3" fill="#a9792b"/>
  <circle cx="540" cy="120" r="3" fill="#a9792b"/>
  <circle cx="620" cy="115" r="3" fill="#a9792b"/>
  <circle cx="700" cy="110" r="3" fill="#a9792b"/>
  <!-- Week labels -->
  <text x="140" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W1</text>
  <text x="220" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W3</text>
  <text x="300" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W5</text>
  <text x="380" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W7</text>
  <text x="460" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W9</text>
  <text x="540" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W11</text>
  <text x="620" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#6e6e73">W13</text>
  <text x="700" y="430" textAnchor="middle" font-family="Space Mono, monospace" font-size="10" fill="#a9792b">W16</text>
  <!-- Stats row -->
  <rect x="60" y="440" width="200" height="40" rx="8" fill="#1c1c1e"/>
  <text x="160" y="465" textAnchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e6e73">Actual</text>
  <text x="160" y="482" textAnchor="middle" font-family="Space Mono, monospace" font-size="16" fill="#f5f5f7" font-weight="700">9.2→11.4%</text>
  <rect x="280" y="440" width="240" height="40" rx="8" fill="#1c1c1e"/>
  <text x="400" y="465" textAnchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e6e73">Projected</text>
  <text x="400" y="482" textAnchor="middle" font-family="Space Mono, monospace" font-size="16" fill="#a9792b" font-weight="700">12.0%</text>
  <rect x="540" y="440" width="200" height="40" rx="8" fill="#1c1c1e"/>
  <text x="640" y="465" textAnchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e6e73">Confidence</text>
  <text x="640" y="482" textAnchor="middle" font-family="Space Mono, monospace" font-size="16" fill="#a9792b" font-weight="700">87%</text>
</svg>
