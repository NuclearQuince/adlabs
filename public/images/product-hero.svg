<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#1d1d1f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a9792b"/>
      <stop offset="100%" stop-color="#c99b4a"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9792b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a9792b" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4d1f" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3d4d1f" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="500" fill="url(#accent)" opacity="0.03"/>
  <!-- Chart area -->
  <rect x="60" y="40" width="680" height="300" rx="12" fill="#1c1c1e" stroke="#a9792b" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Grid lines -->
  <line x1="60" y1="115" x2="740" y2="115" stroke="#a9792b" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="60" y1="190" x2="740" y2="190" stroke="#a9792b" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="60" y1="265" x2="740" y2="265" stroke="#a9792b" stroke-opacity="0.08" stroke-width="1"/>
  <line x1="60" y1="340" x2="740" y2="340" stroke="#a9792b" stroke-opacity="0.08" stroke-width="1"/>
  <!-- Bars -->
  <rect x="80" y="280" width="40" height="60" rx="4" fill="url(#bar1)"/>
  <rect x="140" y="260" width="40" height="80" rx="4" fill="url(#bar1)"/>
  <rect x="200" y="240" width="40" height="100" rx="4" fill="url(#bar1)"/>
  <rect x="260" y="220" width="40" height="120" rx="4" fill="url(#bar1)"/>
  <rect x="320" y="200" width="40" height="140" rx="4" fill="url(#bar1)"/>
  <rect x="380" y="180" width="40" height="160" rx="4" fill="url(#bar1)"/>
  <rect x="440" y="160" width="40" height="180" rx="4" fill="url(#bar1)"/>
  <rect x="500" y="140" width="40" height="200" rx="4" fill="url(#bar1)"/>
  <rect x="560" y="120" width="40" height="220" rx="4" fill="url(#bar1)"/>
  <rect x="620" y="100" width="40" height="240" rx="4" fill="url(#bar1)"/>
  <rect x="680" y="80" width="40" height="260" rx="4" fill="url(#bar1)"/>
  <!-- Line -->
  <polyline points="80,280 140,260 200,240 260,220 320,200 380,180 440,160 500,140 560,120 620,100 680,80" fill="none" stroke="#a9792b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="680" cy="80" r="5" fill="#a9792b" opacity="0.5"/>
  <!-- Prediction dashed -->
  <line x1="680" y1="80" x2="720" y2="60" stroke="#a9792b" stroke-width="2.5" stroke-dasharray="6 4" stroke-linecap="round" opacity="0.5"/>
  <circle cx="720" cy="60" r="4" fill="#a9792b" opacity="0.3"/>
  <!-- Confidence band -->
  <polygon points="680,80 720,60 720,75 680,95" fill="#a9792b" opacity="0.06"/>
  <!-- Labels -->
  <text x="400" y="420" textAnchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="28" fill="#a9792b" font-weight="700">Product Performance</text>
  <text x="400" y="450" textAnchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#6e6e73">Gaze trends · touch rates · sector fixtures</text>
  <!-- Corner decorative elements -->
  <rect x="60" y="40" width="20" height="2" fill="#a9792b" opacity="0.4"/>
  <rect x="60" y="40" width="2" height="20" fill="#a9792b" opacity="0.4"/>
  <rect x="740" y="40" width="20" height="2" fill="#a9792b" opacity="0.4"/>
  <rect x="740" y="40" width="2" height="20" fill="#a9792b" opacity="0.4"/>
  <rect x="60" y="328" width="20" height="2" fill="#a9792b" opacity="0.4"/>
  <rect x="60" y="328" width="2" height="12" fill="#a9792b" opacity="0.4"/>
</svg>
